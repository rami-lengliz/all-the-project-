    <rect x="368" y="486" width="232" height="64" rx="32" fill="url(#card)"/>
    <text x="484" y="527" text-anchor="middle">Secure payments</text>
    <rect x="622" y="486" width="250" height="64" rx="32" fill="url(#card)"/>
